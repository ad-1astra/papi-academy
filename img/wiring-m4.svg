<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 826" width="1000" height="826" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="826" fill="#f6f8fb"/><text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">MSN 04 · Radar Altimeter Display: the right connections</text><text x="500" y="62" text-anchor="middle" font-size="13" fill="#4a5b72">Sensor Trig → D7, Echo → D6. LCD in 4-bit mode: RS D12, E D11, DB4–DB7 on D5, D4, D3, D2.</text><rect x="30" y="88" width="220" height="400" rx="10" fill="#1f6fb5"/><text x="140" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ARDUINO UNO</text><path d="M262 120 C422 120 588 144 748 144" fill="none" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/><path d="M262 154 C422 154 588 170 748 170" fill="none" stroke="#1e88e5" stroke-width="3.5" stroke-linecap="round"/><path d="M262 188 C422 188 588 196 748 196" fill="none" stroke="#43a047" stroke-width="3.5" stroke-linecap="round"/><path d="M262 222 C422 222 588 222 748 222" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><path d="M262 222 C422 222 588 302 748 302" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><path d="M262 120 C422 120 588 328 748 328" fill="none" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/><path d="M262 256 C422 256 588 380 748 380" fill="none" stroke="#8e24aa" stroke-width="3.5" stroke-linecap="round"/><path d="M262 222 C422 222 588 406 748 406" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><path d="M262 290 C422 290 588 432 748 432" fill="none" stroke="#fb8c00" stroke-width="3.5" stroke-linecap="round"/><path d="M262 324 C422 324 588 458 748 458" fill="none" stroke="#00acc1" stroke-width="3.5" stroke-linecap="round"/><path d="M262 358 C422 358 588 484 748 484" fill="none" stroke="#d81b60" stroke-width="3.5" stroke-linecap="round"/><path d="M262 392 C422 392 588 510 748 510" fill="none" stroke="#6d4c41" stroke-width="3.5" stroke-linecap="round"/><path d="M262 426 C422 426 588 536 748 536" fill="none" stroke="#3949ab" stroke-width="3.5" stroke-linecap="round"/><path d="M262 120 C422 120 588 562 748 562" fill="none" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/><g><rect x="471" y="330" width="68" height="22" rx="5" fill="#d9b27c" stroke="#7a5a2b"/><text x="505" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#3b2a10">220 Ω</text></g><path d="M262 222 C422 222 588 588 748 588" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><path d="M262 120 C422 120 588 668 748 668" fill="none" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/><path d="M262 222 C422 222 588 720 748 720" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><circle cx="250" cy="120" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="125" text-anchor="end" font-size="15" font-weight="700" fill="#fff">5V</text><circle cx="250" cy="154" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="159" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D7</text><circle cx="250" cy="188" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="193" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D6</text><circle cx="250" cy="222" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="227" text-anchor="end" font-size="15" font-weight="700" fill="#fff">GND</text><circle cx="250" cy="256" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="261" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D12</text><circle cx="250" cy="290" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="295" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D11</text><circle cx="250" cy="324" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="329" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D5</text><circle cx="250" cy="358" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="363" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D4</text><circle cx="250" cy="392" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="397" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D3</text><circle cx="250" cy="426" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="431" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D2</text><rect x="760" y="100" width="210" height="140" rx="10" fill="#e3ecff" stroke="#10233f" stroke-width="2"/><text x="865" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Ultrasonic sensor (4-pin)</text><circle cx="760" cy="144" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="148" font-size="12.5" fill="#10233f">VCC</text><circle cx="760" cy="170" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="174" font-size="12.5" fill="#10233f">Trig</text><circle cx="760" cy="196" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="200" font-size="12.5" fill="#10233f">Echo</text><circle cx="760" cy="222" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="226" font-size="12.5" fill="#10233f">GND</text><rect x="760" y="258" width="210" height="348" rx="10" fill="#e6f6d8" stroke="#10233f" stroke-width="2"/><text x="865" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">LCD 16 x 2</text><circle cx="760" cy="302" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="306" font-size="12.5" fill="#10233f">GND</text><circle cx="760" cy="328" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="332" font-size="12.5" fill="#10233f">VCC</text><circle cx="760" cy="354" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="358" font-size="12.5" fill="#10233f">V0 (contrast)</text><circle cx="760" cy="380" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="384" font-size="12.5" fill="#10233f">RS</text><circle cx="760" cy="406" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="410" font-size="12.5" fill="#10233f">RW</text><circle cx="760" cy="432" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="436" font-size="12.5" fill="#10233f">E</text><circle cx="760" cy="458" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="462" font-size="12.5" fill="#10233f">DB4</text><circle cx="760" cy="484" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="488" font-size="12.5" fill="#10233f">DB5</text><circle cx="760" cy="510" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="514" font-size="12.5" fill="#10233f">DB6</text><circle cx="760" cy="536" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="540" font-size="12.5" fill="#10233f">DB7</text><circle cx="760" cy="562" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="566" font-size="12.5" fill="#10233f">LED Anode (backlight)</text><circle cx="760" cy="588" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="592" font-size="12.5" fill="#10233f">LED Cathode</text><rect x="760" y="624" width="210" height="114" rx="10" fill="#e3ecff" stroke="#10233f" stroke-width="2"/><text x="865" y="648" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Potentiometer (LCD contrast)</text><circle cx="760" cy="668" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="672" font-size="12.5" fill="#10233f">Terminal 1</text><circle cx="760" cy="694" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="698" font-size="12.5" fill="#10233f">Wiper (middle)</text><circle cx="760" cy="720" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="724" font-size="12.5" fill="#10233f">Terminal 2</text><text x="30" y="790" font-size="12.5" fill="#4a5b72">Also: the potentiometer Wiper (middle pin) goes to LCD V0. It does not use an Arduino pin.</text><text x="30" y="810" font-size="12" fill="#4a5b72">Red wire = 5V · Black wire = GND · Brown box = 220 Ω resistor · GND/5V go through the breadboard rails</text><path d="M748 694 C690 694 690 354 748 354" fill="none" stroke="#e91e63" stroke-width="3.5"/><text x="672" y="530" text-anchor="end" font-size="12" font-weight="700" fill="#e91e63">Wiper → V0</text></svg>