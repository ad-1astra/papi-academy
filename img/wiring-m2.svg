D cathode</text><circle cx="760" cy="802" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="806" font-size="12.5" fill="#10233f">Red LED anode</text><circle cx="760" cy="828" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="832" font-size="12.5" fill="#10233f">Red LED cathode</text><text x="30" y="898" font-size="12.5" fill="#4a5b72">Anode = the longer / bent leg (+). Cathode = the short / flat-side leg (−).</text><text x="30" y="918" font-size="12" fill="#4a5b72">Red wire = 5V · Black wire = GND · Brown box = 220 Ω resistor · GND/5V go through the breadboard rails</text></svg>