<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="620" fill="#f6f8fb"/><text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#10233f">MSN 03 · Stall Warning System: the right connections</text><text x="500" y="62" text-anchor="middle" font-size="13" fill="#4a5b72">Knob = angle of attack. Yellow LED on D12, red LED on D13, piezo horn on D8.</text><rect x="30" y="88" width="220" height="264" rx="10" fill="#1f6fb5"/><text x="140" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ARDUINO UNO</text><path d="M262 120 C422 120 588 144 748 144" fill="none" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/><path d="M262 154 C422 154 588 170 748 170" fill="none" stroke="#1e88e5" stroke-width="3.5" stroke-linecap="round"/><path d="M262 188 C422 188 588 196 748 196" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><path d="M262 222 C422 222 588 276 748 276" fill="none" stroke="#43a047" stroke-width="3.5" stroke-linecap="round"/><g><rect x="471" y="238" width="68" height="22" rx="5" fill="#d9b27c" stroke="#7a5a2b"/><text x="505" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#3b2a10">220 Ω</text></g><path d="M262 188 C422 188 588 302 748 302" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><path d="M262 256 C422 256 588 382 748 382" fill="none" stroke="#8e24aa" stroke-width="3.5" stroke-linecap="round"/><g><rect x="471" y="308" width="68" height="22" rx="5" fill="#d9b27c" stroke="#7a5a2b"/><text x="505" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#3b2a10">220 Ω</text></g><path d="M262 188 C422 188 588 408 748 408" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><path d="M262 290 C422 290 588 488 748 488" fill="none" stroke="#fb8c00" stroke-width="3.5" stroke-linecap="round"/><path d="M262 188 C422 188 588 514 748 514" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><circle cx="250" cy="120" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="125" text-anchor="end" font-size="15" font-weight="700" fill="#fff">5V</text><circle cx="250" cy="154" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="159" text-anchor="end" font-size="15" font-weight="700" fill="#fff">A0</text><circle cx="250" cy="188" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="193" text-anchor="end" font-size="15" font-weight="700" fill="#fff">GND</text><circle cx="250" cy="222" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="227" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D12</text><circle cx="250" cy="256" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="261" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D13</text><circle cx="250" cy="290" r="7" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="234" y="295" text-anchor="end" font-size="15" font-weight="700" fill="#fff">D8</text><rect x="760" y="100" width="210" height="114" rx="10" fill="#e3ecff" stroke="#10233f" stroke-width="2"/><text x="865" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Potentiometer (AoA vane)</text><circle cx="760" cy="144" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="148" font-size="12.5" fill="#10233f">Terminal 1</text><circle cx="760" cy="170" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="174" font-size="12.5" fill="#10233f">Wiper (middle)</text><circle cx="760" cy="196" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="200" font-size="12.5" fill="#10233f">Terminal 2</text><rect x="760" y="232" width="210" height="88" rx="10" fill="#fff8d6" stroke="#10233f" stroke-width="2"/><text x="865" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Yellow LED · caution</text><circle cx="760" cy="276" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="280" font-size="12.5" fill="#10233f">Anode (+)</text><circle cx="760" cy="302" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="306" font-size="12.5" fill="#10233f">Cathode (−)</text><rect x="760" y="338" width="210" height="88" rx="10" fill="#ffe3e0" stroke="#10233f" stroke-width="2"/><text x="865" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Red LED · stall warning</text><circle cx="760" cy="382" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="386" font-size="12.5" fill="#10233f">Anode (+)</text><circle cx="760" cy="408" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="412" font-size="12.5" fill="#10233f">Cathode (−)</text><rect x="760" y="444" width="210" height="88" rx="10" fill="#ececec" stroke="#10233f" stroke-width="2"/><text x="865" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#10233f">Piezo · stall horn</text><circle cx="760" cy="488" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="492" font-size="12.5" fill="#10233f">Positive</text><circle cx="760" cy="514" r="6" fill="#fff" stroke="#10233f" stroke-width="2"/><text x="774" y="518" font-size="12.5" fill="#10233f">Negative</text><text x="30" y="584" font-size="12.5" fill="#4a5b72">The piezo has no resistor. tone() on D8 makes the sound.</text><text x="30" y="604" font-size="12" fill="#4a5b72">Red wire = 5V · Black wire = GND · Brown box = 220 Ω resistor · GND/5V go through the breadboard rails</text></svg>